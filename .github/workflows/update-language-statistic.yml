name: Update language statistic

on:
  schedule:
    # SHA-256("RarkHopper/RarkHopper")の先頭32 bitを1..59へ割り当てたminute
    - cron: "29 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-language-statistic
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: language-statistic

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Generate language statistic
        run: npm run generate
        env:
          LANGUAGE_STATISTIC_TOKEN: ${{ secrets.LANGUAGE_STATISTIC_TOKEN }}

      - name: Scan generated files
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: dir --redact --verbose /github/workspace

      - name: Commit generated files when changed
        run: |
          if git diff --quiet -- dist/language.svg dist/scatter.svg; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/language.svg dist/scatter.svg
          git commit -m "Update language statistic"
          git push
